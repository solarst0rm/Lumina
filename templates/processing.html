{% extends "layout.html" %}

{% block page_title %}处理中{% endblock %}

{% block content %}
<div class="card" style="text-align: center;">
    <h2>正在处理文档</h2>
    <p style="color: var(--text-secondary); margin: 12px 0 20px;">
        已收到文件{% if uploaded_filename %}：{{ uploaded_filename }}{% endif %}，系统正在后台继续处理，请稍候。
    </p>

    <div class="loading" style="display: block;">
        <div class="spinner"></div>
        <p id="jobStatusText">正在解析内容并生成总结与练习题，请耐心等待。</p>
    </div>

    <p id="jobErrorText" style="display: none; color: #c53030; margin-top: 16px;"></p>

    <div style="margin-top: 24px;">
        <a class="btn btn-secondary" href="{{ url_for('index') }}">返回上传页</a>
    </div>
</div>

<script>
const jobId = {{ job_id | tojson }};
const statusText = document.getElementById('jobStatusText');
const errorText = document.getElementById('jobErrorText');
const PROCESSING_AUDIO_STATE_KEY = 'blind-notes-processing-audio';
const PROCESSING_STATUS_KEY = 'blind-notes-processing-status';
const WAITING_AUDIO_URL = {{ url_for('static', filename='audio/waiting.mp3') | tojson }};

let processingAudio = null;
let processingAudioSyncTimer = null;

function readSessionJson(key) {
    if (!window.sessionStorage) {
        return null;
    }

    const raw = window.sessionStorage.getItem(key);
    if (!raw) {
        return null;
    }

    try {
        return JSON.parse(raw);
    } catch (error) {
        return null;
    }
}

function saveProcessingSessionState() {
    if (!window.sessionStorage) {
        return;
    }

    const hasActiveAudio = !!processingAudio && !processingAudio.paused;
    if (hasActiveAudio) {
        window.sessionStorage.setItem(
            PROCESSING_AUDIO_STATE_KEY,
            JSON.stringify({
                active: true,
                currentTime: processingAudio.currentTime || 0,
                volume: processingAudio.volume || 0.28,
            })
        );
    } else {
        window.sessionStorage.removeItem(PROCESSING_AUDIO_STATE_KEY);
    }
}

function clearProcessingSessionState() {
    if (!window.sessionStorage) {
        return;
    }

    window.sessionStorage.removeItem(PROCESSING_AUDIO_STATE_KEY);
    window.sessionStorage.removeItem(PROCESSING_STATUS_KEY);
}

function stopProcessingAudio(clearState) {
    if (processingAudioSyncTimer) {
        window.clearInterval(processingAudioSyncTimer);
        processingAudioSyncTimer = null;
    }

    if (processingAudio) {
        processingAudio.pause();
        processingAudio = null;
    }

    if (clearState) {
        clearProcessingSessionState();
    } else {
        saveProcessingSessionState();
    }
}

function restoreProcessingAudio() {
    const processingStatus = readSessionJson(PROCESSING_STATUS_KEY);
    if (!processingStatus || !processingStatus.pending) {
        return;
    }

    const audioState = readSessionJson(PROCESSING_AUDIO_STATE_KEY);
    const isActive = !audioState || audioState.active !== false;

    processingAudio = new Audio(WAITING_AUDIO_URL);
    processingAudio.loop = true;
    processingAudio.preload = 'auto';
    processingAudio.volume = Math.max(0.05, Math.min(0.28, Number(audioState && audioState.volume) || 0.28));

    try {
        processingAudio.currentTime = Math.max(0, Number(audioState && audioState.currentTime) || 0);
    } catch (error) {
        processingAudio.currentTime = 0;
    }

    if (!isActive) {
        processingAudio.currentTime = 0;
    }

    const playPromise = processingAudio.play();
    if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(function() {});
    }

    if (processingAudioSyncTimer) {
        window.clearInterval(processingAudioSyncTimer);
    }
    processingAudioSyncTimer = window.setInterval(saveProcessingSessionState, 500);
}

function pollJobStatus() {
    fetch(`/api/process-status/${jobId}`, {
        headers: { 'X-Requested-With': 'XMLHttpRequest' }
    })
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            if (!data.success) {
                throw new Error(data.error || '获取任务状态失败');
            }

            if (data.status === 'completed') {
                saveProcessingSessionState();
                window.location.href = `/process-result/${jobId}`;
                return;
            }

            if (data.status === 'failed') {
                stopProcessingAudio(true);
                statusText.textContent = '处理失败';
                errorText.style.display = 'block';
                errorText.textContent = data.error || '文档处理失败，请返回上传页后重试。';
                return;
            }

            statusText.textContent = '系统仍在处理中，正在准备总结与练习题……';
            window.setTimeout(pollJobStatus, 3000);
        })
        .catch(function(error) {
            statusText.textContent = '获取任务状态失败，正在自动重试……';
            errorText.style.display = 'block';
            errorText.textContent = error.message || '连接状态检查失败，请稍后再试。';
            window.setTimeout(pollJobStatus, 5000);
        });
}

restoreProcessingAudio();
window.addEventListener('pagehide', saveProcessingSessionState);
window.setTimeout(pollJobStatus, 1000);
</script>
{% endblock %}
