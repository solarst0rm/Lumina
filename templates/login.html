{% extends "layout.html" %}

{% block page_title %}用户登录{% endblock %}

{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 25px;">
            <i class="fas fa-sign-in-alt"></i> 用户登录
        </h2>

        <form method="post">
            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user"></i> 用户名：
                </label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名">
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> 密码：
                </label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>

            <button type="submit" class="btn" style="width: 100%; margin-top: 20px;">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color);">
            <p style="color: var(--text-secondary); margin-bottom: 10px;">还没有账号？</p>
            <a href="{{ url_for('register') }}" class="btn btn-secondary">
                <i class="fas fa-user-plus"></i> 立即注册
            </a>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const shouldSpeakLoginError = {{ speak_login_error | tojson }};
    if (!shouldSpeakLoginError) {
        return;
    }

    let hasSpoken = false;

    function speakLoginError() {
        if (hasSpoken) {
            return;
        }
        hasSpoken = true;

        if (!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)) {
            return;
        }

        try {
            window.speechSynthesis.cancel();
        } catch (e) {}

        const utterance = new SpeechSynthesisUtterance('用户名或密码错误');
        utterance.lang = 'zh-CN';
        utterance.rate = typeof window._rate === 'number' ? window._rate : 1;
        window.speechSynthesis.speak(utterance);
    }

    try {
        const audio = new Audio("{{ url_for('static', filename='audio/incorrect.mp3') }}");
        audio.preload = 'auto';
        audio.addEventListener('ended', speakLoginError, { once: true });
        audio.addEventListener('error', speakLoginError, { once: true });

        const playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(function() {
                speakLoginError();
            });
        }
    } catch (e) {
        speakLoginError();
    }
});
</script>
{% endblock %}
