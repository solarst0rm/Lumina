{% extends "layout.html" %}

{% block page_title %}{{ page_heading or '练习闯关' }}{% endblock %}

{% block content %}
<style>
    .quiz-topbar {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 18px;
    }

    .quiz-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
    }

    .quiz-choice-btn,
    .quiz-option-btn,
    .quiz-action-btn {
        width: 100%;
        min-height: 58px;
        font-size: 1rem;
    }

    .quiz-choice-btn,
    .quiz-action-btn {
        justify-content: center;
    }

    .quiz-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--text-secondary);
    }

    .quiz-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
    }

    .quiz-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 107, 53, 0.12);
        color: var(--primary-color);
        padding: 6px 12px;
        border-radius: 999px;
        font-weight: 600;
    }

    .quiz-question {
        font-size: 1.15rem;
        line-height: 1.9;
        margin-bottom: 18px;
    }

    .quiz-options {
        display: grid;
        gap: 12px;
    }

    .quiz-option-btn {
        border: 1px solid var(--border-color);
        background: var(--surface-color);
        color: var(--text-primary);
        border-radius: 12px;
        padding: 16px 18px;
        cursor: pointer;
        transition: all 0.2s ease;
        text-align: left;
    }

    .quiz-option-btn:hover,
    .quiz-option-btn:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.08);
    }

    .quiz-option-btn[disabled] {
        opacity: 0.78;
        cursor: not-allowed;
    }

    .quiz-option-key {
        display: block;
        font-weight: 700;
        color: var(--primary-color);
        margin-bottom: 4px;
    }

    .quiz-feedback {
        margin-top: 18px;
        padding: 16px 18px;
        border-radius: 12px;
        background: rgba(56, 161, 105, 0.08);
        border: 1px solid rgba(56, 161, 105, 0.16);
        display: none;
        white-space: pre-wrap;
        line-height: 1.8;
    }

    .quiz-feedback.error {
        background: rgba(229, 62, 62, 0.08);
        border-color: rgba(229, 62, 62, 0.18);
    }

    .quiz-feedback-actions {
        display: none;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
        flex-shrink: 0;
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
    }

    @media (max-width: 768px) {
        .quiz-header {
            flex-direction: column;
            align-items: stretch;
        }

        .quiz-feedback-actions {
            width: 100%;
            justify-content: stretch;
        }

        .quiz-choice-btn,
        .quiz-option-btn,
        .quiz-action-btn {
            min-height: 54px;
            font-size: 0.95rem;
        }

        .quiz-question {
            font-size: 1.02rem;
        }
    }
</style>

<div class="quiz-topbar">
    <a href="{{ back_url or url_for('result_page') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> 返回上一级
    </a>
</div>

<div id="difficulty-card" class="card">
    <div class="quiz-grid">
        <button class="btn quiz-choice-btn" data-difficulty="简单">简单</button>
        <button class="btn btn-secondary quiz-choice-btn" data-difficulty="进阶">进阶</button>
        <button class="btn btn-danger quiz-choice-btn" data-difficulty="困难">困难</button>
        <button class="btn quiz-choice-btn" data-skip="1" style="background-color: var(--sidebar-bg);">跳过</button>
    </div>
</div>

<div id="question-card" class="card" style="display:none;">
    <div class="quiz-header">
        <div class="quiz-meta">
            <span id="difficulty-badge" class="quiz-badge"></span>
            <span id="question-progress"></span>
        </div>
        <div id="feedback-actions" class="quiz-feedback-actions"></div>
    </div>
    <div id="question-text" class="quiz-question"></div>
    <div id="options-box" class="quiz-options"></div>
    <div id="feedback-box" class="quiz-feedback"></div>
</div>

<div id="decision-card" class="card" style="display:none;">
    <h3 id="decision-title" style="color: var(--primary-color); margin-bottom: 10px;"></h3>
    <p id="decision-text" style="color: var(--text-secondary); margin-bottom: 18px;"></p>
    <div id="decision-actions" class="quiz-grid"></div>
</div>

<div id="quiz-live-region" class="sr-only" aria-live="polite"></div>

<script>
window._tutorialPageKey = {{ ('tutorial-challenge' if tutorial_demo else 'exercise-challenge') | tojson }};
window._disableGlobalAIAssistantHotkeys = false;
window._aiAssistantPageEnabled = true;
window._aiAssistantPageName = 'exercise_challenge';
window._uploadedFileName = {{ uploaded_filename | default('') | tojson }};
window._aiAssistantDocumentName = window._uploadedFileName || '';
window._sumText = {{ summary_text | default('') | tojson }};
window._exText = {{ exercise_markdown | tojson }};
const SOURCE_FILE = {{ source_file | default('') | tojson }};
const RETURN_URL = {{ (return_url or finish_url or back_url or '') | tojson }};
const AUTO_START_DIFFICULTY = {{ auto_start_difficulty | default('') | tojson }};
const IS_MISTAKE_REDO = {{ is_mistake_redo | default(false) | tojson }};

let quizData = {{ quiz_data | tojson }};
const difficultyOrder = ['简单', '进阶', '困难'];
const state = {
    currentDifficulty: null,
    questionIndex: 0,
    waitingAction: 'difficulty',
    answeredLocked: false,
};

let recognition = null;
let isRecording = false;
let lastTranscript = '';
let currentVoiceSource = '';
let vKeyPressed = false;
let currentDecisionSpeechText = '';

const QUIZ_RATE_MIN = 0.5;
const QUIZ_RATE_MAX = 2.0;
const QUIZ_RATE_STEP = 0.1;

const liveRegion = document.getElementById('quiz-live-region');
const difficultyCard = document.getElementById('difficulty-card');
const questionCard = document.getElementById('question-card');
const decisionCard = document.getElementById('decision-card');
const decisionTitle = document.getElementById('decision-title');
const decisionText = document.getElementById('decision-text');
const decisionActions = document.getElementById('decision-actions');
const difficultyBadge = document.getElementById('difficulty-badge');
const questionProgress = document.getElementById('question-progress');
const questionText = document.getElementById('question-text');
const optionsBox = document.getElementById('options-box');
const feedbackBox = document.getElementById('feedback-box');
const feedbackActions = document.getElementById('feedback-actions');
const backToResultLink = document.querySelector('.quiz-topbar a');

function isEditableTarget(target) {
    return !!(
        target && (
            target.tagName === 'INPUT' ||
            target.tagName === 'TEXTAREA' ||
            target.tagName === 'SELECT' ||
            target.isContentEditable
        )
    );
}

function roundRate(value) {
    return Math.round(value * 10) / 10;
}

function stopSpeechPlayback() {
    if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
    }
}

function speak(text, callback) {
    liveRegion.textContent = text || '';
    if (!window.speechSynthesis || !text) {
        if (callback) callback();
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = window._rate || 1;
    if (callback) {
        utterance.onend = callback;
    }
    window.speechSynthesis.speak(utterance);
}

function announce(text) {
    speak(text);
}

function getCurrentQuestions() {
    return quizData.difficulties[state.currentDifficulty] || [];
}

function getCurrentQuestion() {
    return getCurrentQuestions()[state.questionIndex];
}

window._aiAssistantGetPageContext = function() {
    const question = getCurrentQuestion();
    return {
        page: 'exercise_challenge',
        uploaded_filename: window._aiAssistantDocumentName || '',
        current_difficulty: state.currentDifficulty || '',
        current_step: state.waitingAction || '',
        current_question_index: question ? state.questionIndex + 1 : 0,
        current_question_total: getCurrentQuestions().length,
        current_question: question ? question.question : '',
        current_options: question ? question.options.map(option => `${option.key}. ${option.text}`).join('\n') : '',
    };
};

function nextDifficulty() {
    const currentIndex = difficultyOrder.indexOf(state.currentDifficulty);
    if (currentIndex === -1 || currentIndex === difficultyOrder.length - 1) {
        return null;
    }
    return difficultyOrder[currentIndex + 1];
}

function buildDifficultySelectionSpeech() {
    return '请选择你想挑战的难度。按1选择简单，按2选择进阶，按3选择困难，按4选择跳过，按左箭头返回上一级。进入题目后，可按A到D作答，按V键进行语音输入，按左右箭头切换题目，按R重读，按上下箭头调整语速。';
}

function buildQuestionSpeech(question) {
    const options = question.options.map(option => `${option.key}，${option.text}`).join('。');
    return `${state.currentDifficulty}模式，第${state.questionIndex + 1}题。${question.question}。选项如下。${options}。请按A到D作答，按V键语音输入，按R重读。`;
}

function buildAnswerLabel(question) {
    const option = question.options.find(item => item.key === question.answer);
    return option ? `${option.key}，${option.text}` : question.answer;
}

function recordMistake(question, selectedKey) {
    if (!question || IS_MISTAKE_REDO) {
        return;
    }

    const sourceFilename = SOURCE_FILE || window._uploadedFileName || '未命名文档';
    fetch("{{ url_for('api_add_mistake') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            source_filename: sourceFilename,
            difficulty: state.currentDifficulty || '',
            question_text: question.question || '',
            options: Array.isArray(question.options) ? question.options : [],
            correct_answer: buildAnswerLabel(question),
            explanation: question.explanation || '',
            selected_answer: selectedKey || ''
        })
    }).catch(function(error) {
        console.warn('记录错题失败', error);
    });
}

function buildAfterAnswerSpeech() {
    const question = getCurrentQuestion();
    const feedbackText = feedbackBox.textContent.trim();
    if (!question) {
        return feedbackText;
    }
    return `${question.question}。${feedbackText}。按右箭头进入下一题，按R重读。`;
}

function buildDecisionSpeech() {
    if (currentDecisionSpeechText) {
        return currentDecisionSpeechText;
    }

    return [decisionTitle.textContent, decisionText.textContent]
        .map(function(text) { return (text || '').trim(); })
        .filter(Boolean)
        .join('。');
}

function getCurrentSpeechText() {
    if (state.waitingAction === 'difficulty') {
        return buildDifficultySelectionSpeech();
    }

    if (state.waitingAction === 'question') {
        const question = getCurrentQuestion();
        return question ? buildQuestionSpeech(question) : '';
    }

    if (state.waitingAction === 'after_answer') {
        return buildAfterAnswerSpeech();
    }

    if (state.waitingAction === 'continue' || state.waitingAction === 'complete') {
        return buildDecisionSpeech();
    }

    return '';
}

function repeatCurrentSpeech() {
    const speechText = getCurrentSpeechText();
    if (speechText) {
        announce(speechText);
    }
}

function hideFeedback() {
    feedbackBox.style.display = 'none';
    feedbackBox.textContent = '';
    feedbackBox.classList.remove('error');
    feedbackActions.style.display = 'none';
    feedbackActions.innerHTML = '';
}

function showFeedback(text, isError) {
    feedbackBox.style.display = 'block';
    feedbackBox.textContent = text;
    feedbackBox.classList.toggle('error', !!isError);
}

function renderActionButtons(container, actions) {
    container.innerHTML = '';
    actions.forEach(action => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `btn quiz-action-btn ${action.className || ''}`.trim();
        button.textContent = action.label;
        button.addEventListener('click', action.onClick);
        container.appendChild(button);
    });
}

function lockOptions(locked) {
    const buttons = optionsBox.querySelectorAll('button');
    buttons.forEach(button => {
        button.disabled = locked;
    });
}

function renderQuestion() {
    const question = getCurrentQuestion();
    if (!question) {
        onDifficultyFinished();
        return;
    }

    state.waitingAction = 'question';
    state.answeredLocked = false;
    currentDecisionSpeechText = '';
    hideFeedback();
    difficultyCard.style.display = 'none';
    decisionCard.style.display = 'none';
    questionCard.style.display = 'block';

    difficultyBadge.textContent = `${state.currentDifficulty}模式`;
    questionProgress.textContent = `第 ${state.questionIndex + 1} / ${getCurrentQuestions().length} 题`;
    questionText.textContent = question.question;
    optionsBox.innerHTML = '';

    question.options.forEach(option => {
        const button = document.createElement('button');
        button.className = 'quiz-option-btn';
        button.type = 'button';
        button.innerHTML = `
            <span class="quiz-option-key">${option.key}</span>
            <span>${option.text}</span>
        `;
        button.addEventListener('click', function() {
            submitAnswer(option.key);
        });
        optionsBox.appendChild(button);
    });

    announce(buildQuestionSpeech(question));
}

function startDifficulty(difficulty) {
    state.currentDifficulty = difficulty;
    state.questionIndex = 0;
    renderQuestion();
}

function goToQuestion(index) {
    const questions = getCurrentQuestions();
    if (!questions.length) {
        return;
    }

    if (index < 0) {
        announce('已经是本难度第一题。');
        return;
    }

    if (index >= questions.length) {
        announce('已经是本难度最后一题。');
        return;
    }

    stopSpeechPlayback();
    state.questionIndex = index;
    renderQuestion();
}

function goToPreviousQuestion() {
    if (state.waitingAction !== 'question') {
        return;
    }
    goToQuestion(state.questionIndex - 1);
}

function goToNextQuestion() {
    if (state.waitingAction === 'after_answer') {
        proceedAfterAnswer();
        return;
    }

    if (state.waitingAction !== 'question') {
        return;
    }

    goToQuestion(state.questionIndex + 1);
}

function adjustQuizSpeechRate(delta) {
    const currentRate = typeof window._rate === 'number' ? window._rate : 1;
    const nextRate = Math.min(QUIZ_RATE_MAX, Math.max(QUIZ_RATE_MIN, roundRate(currentRate + delta)));

    if (nextRate === currentRate) {
        announce(delta > 0 ? '已经是最快语速。' : '已经是最慢语速。');
        return;
    }

    window._rate = nextRate;
    announce(`当前语速为${nextRate}倍。`);
}

function goBackToResultPage() {
    stopSpeechPlayback();
    if (backToResultLink && backToResultLink.href) {
        window.location.href = backToResultLink.href;
        return;
    }
    window.location.href = "{{ back_url or url_for('result_page') }}";
}

function proceedAfterAnswer() {
    stopSpeechPlayback();
    const questionCount = getCurrentQuestions().length;
    if (state.questionIndex < questionCount - 1) {
        state.questionIndex += 1;
        renderQuestion();
        return;
    }
    onDifficultyFinished();
}

function playTone(kind) {
    const audioMap = {
        success: '/static/audio/quiz-correct.mp3',
        error: '/static/audio/quiz-wrong.mp3',
    };
    const audio = new Audio(audioMap[kind]);
    audio.play().catch(function() {
        playFallbackTone(kind);
    });
}

function playFallbackTone(kind) {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
            return;
        }
        const context = new AudioContextClass();
        const oscillator = context.createOscillator();
        const gainNode = context.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(context.destination);
        oscillator.type = 'sine';
        oscillator.frequency.value = kind === 'success' ? 880 : 240;
        gainNode.gain.setValueAtTime(0.25, context.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.45);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.45);
        oscillator.onended = function() {
            context.close();
        };
    } catch (error) {
        console.warn('音效播放失败', error);
    }
}

function submitAnswer(selectedKey) {
    if (state.waitingAction !== 'question' || state.answeredLocked) {
        return;
    }

    const question = getCurrentQuestion();
    if (!question) {
        return;
    }

    state.answeredLocked = true;
    state.waitingAction = 'after_answer';
    lockOptions(true);

    const isLastQuestion = state.questionIndex === getCurrentQuestions().length - 1;
    const nextLabel = isLastQuestion ? '完成本轮' : '下一题';

    if (selectedKey === question.answer) {
        playTone('success');
        showFeedback('回答正确：太棒啦', false);
        renderActionButtons(feedbackActions, [
            {
                label: nextLabel,
                className: 'btn-success',
                onClick: proceedAfterAnswer,
            }
        ]);
        feedbackActions.style.display = 'flex';
        announce('太棒啦。按右箭头进入下一题，按R重读。');
        return;
    }

    const correctLabel = buildAnswerLabel(question);
    playTone('error');
    recordMistake(question, selectedKey);
    showFeedback(`回答错误\n正确答案：${correctLabel}\n解析：${question.explanation}`, true);
    renderActionButtons(feedbackActions, [
        {
            label: nextLabel,
            className: 'btn-secondary',
            onClick: proceedAfterAnswer,
        }
    ]);
    feedbackActions.style.display = 'flex';
    announce(`可惜，这题正确答案是${correctLabel}哦。${question.explanation}。按右箭头进入下一题，按R重读。`);
}

function renderDecision(title, text, actions, speechText, waitingAction) {
    questionCard.style.display = 'none';
    difficultyCard.style.display = 'none';
    decisionCard.style.display = 'block';
    state.waitingAction = waitingAction;
    currentDecisionSpeechText = speechText || [title, text].filter(Boolean).join('。');
    decisionTitle.textContent = title;
    decisionText.textContent = text;
    renderActionButtons(decisionActions, actions);
    announce(currentDecisionSpeechText);
}

function onDifficultyFinished() {
    if (IS_MISTAKE_REDO) {
        renderDecision(
            '错题重做完成',
            '这道错题已经完成。你可以再做一次，或者返回错题本继续复习。',
            [
                {
                    label: '再做一次',
                    className: 'btn-success',
                    onClick: function() {
                        startDifficulty(AUTO_START_DIFFICULTY || state.currentDifficulty || '错题重做');
                    },
                },
                {
                    label: '返回错题本',
                    className: 'btn-secondary',
                    onClick: finishQuiz,
                }
            ],
            '错题重做完成。按C再做一次，按E返回错题本。',
            'complete'
        );
        return;
    }

    const upcoming = nextDifficulty();
    if (upcoming) {
        renderDecision(
            `${state.currentDifficulty}模式完成`,
            '是否继续答题？',
            [
                {
                    label: '继续',
                    className: 'btn-success',
                    onClick: function() {
                        startDifficulty(upcoming);
                    },
                },
                {
                    label: '结束',
                    className: 'btn-secondary',
                    onClick: finishQuiz,
                }
            ],
            '是否继续答题？请按C继续，按E结束。',
            'continue'
        );
        return;
    }

    finishQuiz();
}

function finishQuiz() {
    stopSpeechPlayback();
    if (RETURN_URL) {
        window.location.href = RETURN_URL;
        return;
    }

    const baseUrl = "{{ url_for('exercise_actions') }}";
    window.location.href = SOURCE_FILE ? `${baseUrl}?source_file=${encodeURIComponent(SOURCE_FILE)}` : baseUrl;
}

function showDifficultySelection() {
    state.currentDifficulty = null;
    state.questionIndex = 0;
    state.waitingAction = 'difficulty';
    state.answeredLocked = false;
    currentDecisionSpeechText = '';
    questionCard.style.display = 'none';
    decisionCard.style.display = 'none';
    difficultyCard.style.display = 'block';
    hideFeedback();
    announce(buildDifficultySelectionSpeech());
}

function normalizeText(text) {
    return (text || '')
        .toLowerCase()
        .replace(/\s+/g, '')
        .replace(/[，。！？、,.!?]/g, '');
}

function matchOptionBySpeech(question, transcript) {
    const normalized = normalizeText(transcript);
    const aliasMap = {
        A: ['a', '选a', 'a项', '诶', '欸', '第一项', '第一个'],
        B: ['b', '选b', 'b项', '比', '第二项', '第二个'],
        C: ['c', '选c', 'c项', '西', '希', '第三项', '第三个'],
        D: ['d', '选d', 'd项', '第四项', '第四个', '弟'],
    };

    for (const option of question.options) {
        const aliases = aliasMap[option.key] || [];
        if (aliases.some(item => normalized.includes(normalizeText(item)))) {
            return option.key;
        }

        const optionText = normalizeText(option.text);
        if (optionText && optionText.length >= 2 && normalized.includes(optionText)) {
            return option.key;
        }
    }

    return null;
}

function handleVoiceCommand(transcript) {
    const normalized = normalizeText(transcript);
    if (!normalized) {
        return;
    }

    if (state.waitingAction === 'difficulty') {
        if (normalized.includes('简单')) {
            startDifficulty('简单');
            return;
        }
        if (normalized.includes('进阶') || normalized.includes('中等')) {
            startDifficulty('进阶');
            return;
        }
        if (normalized.includes('困难')) {
            startDifficulty('困难');
            return;
        }
        if (normalized.includes('跳过') || normalized.includes('结束')) {
            finishQuiz();
            return;
        }
        announce('没有识别到难度选项，请说简单、进阶、困难或跳过。');
        return;
    }

    if (state.waitingAction === 'question') {
        const question = getCurrentQuestion();
        const matchedOption = question ? matchOptionBySpeech(question, transcript) : null;
        if (matchedOption) {
            submitAnswer(matchedOption);
            return;
        }
        announce('没有识别到答案选项，请再说一次。');
        return;
    }

    if (state.waitingAction === 'after_answer') {
        if (normalized.includes('下一题') || normalized.includes('继续')) {
            proceedAfterAnswer();
            return;
        }
        announce('请说下一题。');
        return;
    }

    if (state.waitingAction === 'continue') {
        if (normalized.includes('继续')) {
            const upcoming = nextDifficulty();
            if (upcoming) {
                startDifficulty(upcoming);
                return;
            }
        }
        if (normalized.includes('结束') || normalized.includes('跳过')) {
            finishQuiz();
            return;
        }
        announce('请说继续或结束。');
        return;
    }

    if (state.waitingAction === 'complete' && IS_MISTAKE_REDO) {
        if (normalized.includes('再做') || normalized.includes('重新')) {
            startDifficulty(AUTO_START_DIFFICULTY || state.currentDifficulty || '错题重做');
            return;
        }
        if (normalized.includes('返回') || normalized.includes('结束')) {
            finishQuiz();
            return;
        }
        announce('请说再做一次或返回错题本。');
        return;
    }

}

function ensureRecognition() {
    const SpeechRecognitionClass = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognitionClass) {
        announce('当前浏览器不支持语音输入，请直接点击按钮作答。');
        return false;
    }

    if (!recognition) {
        recognition = new SpeechRecognitionClass();
        recognition.lang = 'zh-CN';
        recognition.continuous = false;
        recognition.interimResults = true;

        recognition.onresult = function(event) {
            let transcript = '';
            for (let index = event.resultIndex; index < event.results.length; index += 1) {
                transcript += event.results[index][0].transcript;
            }
            lastTranscript = transcript;
        };

        recognition.onerror = function(event) {
            isRecording = false;
            currentVoiceSource = '';
            if (event.error !== 'aborted') {
                announce('语音识别失败，请再试一次。');
            }
        };

        recognition.onend = function() {
            const transcript = lastTranscript.trim();
            isRecording = false;
            currentVoiceSource = '';
            lastTranscript = '';
            if (transcript) {
                handleVoiceCommand(transcript);
            }
        };
    }

    return true;
}

function startVoiceCapture(source) {
    if (!ensureRecognition() || isRecording) {
        return;
    }
    stopSpeechPlayback();
    lastTranscript = '';
    isRecording = true;
    currentVoiceSource = source;
    try {
        recognition.start();
    } catch (error) {
        isRecording = false;
        currentVoiceSource = '';
        announce('语音识别启动失败，请再试一次。');
    }
}

function stopVoiceCapture(source) {
    if (!isRecording || !recognition) {
        return;
    }
    if (currentVoiceSource !== source) {
        return;
    }
    recognition.stop();
}

function bindHotkeys() {
    document.addEventListener('keydown', function(event) {
        if (isEditableTarget(event.target) || event.repeat) {
            return;
        }

        if (window._aiWindowOpen) {
            return;
        }

        switch (event.code) {
            case 'Digit1':
            case 'Numpad1':
                if (state.waitingAction !== 'difficulty') {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                startDifficulty('简单');
                return;
            case 'Digit2':
            case 'Numpad2':
                if (state.waitingAction !== 'difficulty') {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                startDifficulty('进阶');
                return;
            case 'Digit3':
            case 'Numpad3':
                if (state.waitingAction !== 'difficulty') {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                startDifficulty('困难');
                return;
            case 'Digit4':
            case 'Numpad4':
                if (state.waitingAction !== 'difficulty') {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                finishQuiz();
                return;
            case 'KeyV':
                event.preventDefault();
                event.stopPropagation();
                vKeyPressed = true;
                startVoiceCapture('keyboard');
                return;
            case 'KeyA':
            case 'KeyB':
            case 'KeyD':
                if (state.waitingAction !== 'question') {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                submitAnswer(event.code.replace('Key', ''));
                return;
            case 'KeyC':
                event.preventDefault();
                event.stopPropagation();
                if (state.waitingAction === 'continue') {
                    const upcoming = nextDifficulty();
                    if (upcoming) {
                        startDifficulty(upcoming);
                    }
                    return;
                }
                if (state.waitingAction === 'complete' && IS_MISTAKE_REDO) {
                    startDifficulty(AUTO_START_DIFFICULTY || state.currentDifficulty || '错题重做');
                    return;
                }
                if (state.waitingAction !== 'question') {
                    return;
                }
                submitAnswer('C');
                return;
            case 'KeyE':
                if (state.waitingAction !== 'continue' && !(state.waitingAction === 'complete' && IS_MISTAKE_REDO)) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                finishQuiz();
                return;
            case 'ArrowLeft':
                event.preventDefault();
                event.stopPropagation();
                if (state.waitingAction === 'difficulty') {
                    goBackToResultPage();
                    return;
                }
                goToPreviousQuestion();
                return;
            case 'ArrowRight':
                event.preventDefault();
                event.stopPropagation();
                goToNextQuestion();
                return;
            case 'KeyR':
                event.preventDefault();
                event.stopPropagation();
                repeatCurrentSpeech();
                return;
            case 'ArrowUp':
                event.preventDefault();
                event.stopPropagation();
                adjustQuizSpeechRate(QUIZ_RATE_STEP);
                return;
            case 'ArrowDown':
                event.preventDefault();
                event.stopPropagation();
                adjustQuizSpeechRate(-QUIZ_RATE_STEP);
                return;
            default:
                return;
        }
    }, true);

    document.addEventListener('keyup', function(event) {
        if (isEditableTarget(event.target) || event.code !== 'KeyV') {
            return;
        }
        event.preventDefault();
        event.stopPropagation();
        vKeyPressed = false;
        stopVoiceCapture('keyboard');
    }, true);

    window.addEventListener('blur', function() {
        if (!vKeyPressed) {
            return;
        }
        vKeyPressed = false;
        stopVoiceCapture('keyboard');
    });
}

function bindButtons() {
    document.querySelectorAll('[data-difficulty]').forEach(function(button) {
        button.addEventListener('click', function() {
            startDifficulty(button.getAttribute('data-difficulty'));
        });
    });

    document.querySelector('[data-skip]').addEventListener('click', finishQuiz);
}

document.addEventListener('DOMContentLoaded', function() {
    if (backToResultLink) {
        backToResultLink.addEventListener('click', function() {
            stopSpeechPlayback();
        });
    }
    bindButtons();
    bindHotkeys();
    if (AUTO_START_DIFFICULTY) {
        startDifficulty(AUTO_START_DIFFICULTY);
        return;
    }
    showDifficultySelection();
});
</script>
