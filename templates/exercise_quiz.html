{% extends "layout.html" %}

{% block page_title %}{{ page_heading or '练习闯关' }}{% endblock %}

{% block content %}
<style>
.quiz-topbar{display:flex;justify-content:flex-start;margin-bottom:18px}
.quiz-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.quiz-choice-btn,.quiz-option-btn,.quiz-action-btn{width:100%;min-height:56px;font-size:1rem}
.quiz-choice-btn,.quiz-action-btn{justify-content:center}
.quiz-header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.quiz-meta{display:flex;flex-wrap:wrap;gap:12px;color:var(--text-secondary)}
.quiz-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,107,53,.12);color:var(--primary-color);padding:6px 12px;border-radius:999px;font-weight:600}
.quiz-question{font-size:1.12rem;line-height:1.9;margin-bottom:18px;white-space:pre-wrap}
.quiz-options{display:grid;gap:12px}
.quiz-option-btn{border:1px solid var(--border-color);background:var(--surface-color);color:var(--text-primary);border-radius:12px;padding:16px 18px;cursor:pointer;text-align:left}
.quiz-option-btn[disabled]{opacity:.78;cursor:not-allowed}
.quiz-option-key{display:block;font-weight:700;color:var(--primary-color);margin-bottom:4px}
.quiz-feedback{display:none;margin-top:18px;padding:16px 18px;border-radius:12px;background:rgba(56,161,105,.08);border:1px solid rgba(56,161,105,.16);white-space:pre-wrap;line-height:1.8}
.quiz-feedback.error{background:rgba(229,62,62,.08);border-color:rgba(229,62,62,.18)}
.quiz-feedback-actions{display:none;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
@media (max-width:768px){.quiz-header{flex-direction:column;align-items:stretch}.quiz-feedback-actions{width:100%;justify-content:stretch}}
</style>

<div class="quiz-topbar">
    <a href="{{ back_url or url_for('result_page') }}" class="btn btn-secondary" id="quiz-back-link">
        <i class="fas fa-arrow-left"></i> 返回上一页
    </a>
</div>

<div id="difficulty-card" class="card">
    <div class="quiz-grid">
        {% for difficulty, questions in quiz_data.difficulties.items() %}
        <button class="btn{% if difficulty in ['Medium', '中等', '普通'] %} btn-secondary{% elif difficulty in ['Hard', '困难'] %} btn-danger{% endif %} quiz-choice-btn" data-difficulty="{{ difficulty }}">
            {{ {'Easy': '简单', 'Medium': '中等', 'Hard': '困难', '简单': '简单', '中等': '中等', '普通': '中等', '困难': '困难'}.get(difficulty, difficulty) }}
        </button>
        {% endfor %}
        <button class="btn quiz-choice-btn" data-skip="1" style="background-color:var(--sidebar-bg)">结束返回</button>
    </div>
</div>

<div id="question-card" class="card" style="display:none;">
    <div class="quiz-header">
        <div class="quiz-meta">
            <span id="difficulty-badge" class="quiz-badge"></span>
            <span id="question-progress"></span>
        </div>
        <div id="feedback-actions" class="quiz-feedback-actions"></div>
    </div>
    <div id="question-text" class="quiz-question"></div>
    <div id="options-box" class="quiz-options"></div>
    <div id="feedback-box" class="quiz-feedback"></div>
</div>

<div id="decision-card" class="card" style="display:none;">
    <h3 id="decision-title" style="color:var(--primary-color);margin-bottom:10px;"></h3>
    <p id="decision-text" style="color:var(--text-secondary);margin-bottom:18px;"></p>
    <div id="decision-actions" class="quiz-grid"></div>
</div>

<div id="quiz-live-region" class="sr-only" aria-live="polite"></div>

<script>
window._tutorialPageKey = {{ ('tutorial-challenge' if tutorial_demo else 'exercise-challenge') | tojson }};
window._disableGlobalAIAssistantHotkeys = false;
window._aiAssistantPageEnabled = true;
window._aiAssistantPageName = 'exercise_challenge';
window._uploadedFileName = {{ uploaded_filename | default('') | tojson }};
window._aiAssistantDocumentName = window._uploadedFileName || '';
window._sumText = {{ summary_text | default('') | tojson }};
window._exText = {{ exercise_markdown | tojson }};

const SOURCE_FILE = {{ source_file | default('') | tojson }};
const RETURN_URL = {{ (return_url or finish_url or back_url or '') | tojson }};
const AUTO_START_DIFFICULTY = {{ auto_start_difficulty | default('') | tojson }};
const AUTO_START_QUESTION_INDEX = {{ auto_start_question_index | default(0) | tojson }};
const IS_MISTAKE_REDO = {{ is_mistake_redo | default(false) | tojson }};
const QUIZ_DATA = {{ quiz_data | tojson }};
const DIFFICULTY_LABELS = {Easy:'简单',Medium:'中等',Hard:'困难',简单:'简单',中等:'中等',普通:'中等',困难:'困难'};
const CANONICAL_ORDER = ['Easy','Medium','Hard'];
const RATE_STEP = 0.1;
const state = {currentDifficulty:null,questionIndex:0,waitingAction:'difficulty',answeredLocked:false,pageShortcutAnnounced:false};
let recognition = null, isRecording = false, lastTranscript = '', voiceSource = '', currentDecisionSpeech = '', holdV = false;

const liveRegion = document.getElementById('quiz-live-region');
const difficultyCard = document.getElementById('difficulty-card');
const questionCard = document.getElementById('question-card');
const decisionCard = document.getElementById('decision-card');
const difficultyBadge = document.getElementById('difficulty-badge');
const questionProgress = document.getElementById('question-progress');
const questionText = document.getElementById('question-text');
const optionsBox = document.getElementById('options-box');
const feedbackBox = document.getElementById('feedback-box');
const feedbackActions = document.getElementById('feedback-actions');
const decisionTitle = document.getElementById('decision-title');
const decisionText = document.getElementById('decision-text');
const decisionActions = document.getElementById('decision-actions');
const backToResultLink = document.getElementById('quiz-back-link');

function editable(t){return !!(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable));}
function labelOf(d){return DIFFICULTY_LABELS[d]||d;}
function readableName(){const raw=SOURCE_FILE||window._uploadedFileName||window._aiAssistantDocumentName||'';return raw.replace(/\.[^.\\/]+$/,'')||raw||'当前文档';}
function orders(){const ds=(QUIZ_DATA&&QUIZ_DATA.difficulties)||{};const canon=CANONICAL_ORDER.filter(k=>Object.prototype.hasOwnProperty.call(ds,k));const extras=Object.keys(ds).filter(k=>canon.indexOf(k)===-1);return canon.concat(extras);}
function difficultyByRank(i){return orders()[i]||null;}
function questions(){return ((QUIZ_DATA&&QUIZ_DATA.difficulties)||{})[state.currentDifficulty]||[];}
function question(){return questions()[state.questionIndex]||null;}
function nextDifficulty(){const list=orders();const idx=list.indexOf(state.currentDifficulty);return idx>=0&&idx<list.length-1?list[idx+1]:null;}
function stopSpeech(){if(window.speechSynthesis)window.speechSynthesis.cancel();}
function speak(text,cb){liveRegion.textContent=text||'';if(!window.speechSynthesis||!text){if(cb)cb();return;}if(typeof window.speakWithGlobalConfig==='function'){window.speakWithGlobalConfig(text,{force:true,onend:cb});return;}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=typeof window._rate==='number'?window._rate:1;if(cb)u.onend=cb;window.speechSynthesis.speak(u);}
function announce(text){speak(text);}
function difficultySpeech(){return '请选择练习难度。按 1 选择简单，按 2 选择中等，按 3 选择困难，按 4 结束返回。';}
function questionSpeech(q){const opts=(q.options||[]).map(o=>o.key+'，'+o.text).join('；');return '第 '+(state.questionIndex+1)+' 题。'+(q.question||'')+'。'+(opts?'选项：'+opts+'。':'');}
function answerLabel(q){const opt=(q.options||[]).find(o=>o.key===q.answer);return opt?opt.key+'，'+opt.text:q.answer;}
function currentSpeech(){if(state.waitingAction==='difficulty')return difficultySpeech();if(state.waitingAction==='question'){const q=question();return q?questionSpeech(q):'';}if(state.waitingAction==='after_answer')return feedbackBox.textContent.trim()||'本题已作答。';if(state.waitingAction==='continue'||state.waitingAction==='complete')return currentDecisionSpeech||[decisionTitle.textContent,decisionText.textContent].filter(Boolean).join('。');return '';}
function repeatSpeech(){const text=currentSpeech();if(text)announce(text);}
function pageSpeech(){return '当前是练习题页面，文档《'+readableName()+'》。难度选择界面可按数字 1 到 4。做题时按 A 到 D 选择答案，左右键切换题目，V 开始语音作答，R 重读当前内容。';}
function announcePageOnce(){if(state.pageShortcutAnnounced){repeatSpeech();return;}state.pageShortcutAnnounced=true;speak(pageSpeech(),repeatSpeech);}
function hideFeedback(){feedbackBox.style.display='none';feedbackBox.textContent='';feedbackBox.classList.remove('error');feedbackActions.style.display='none';feedbackActions.innerHTML='';}
function showFeedback(text,isError){feedbackBox.style.display='block';feedbackBox.textContent=text;feedbackBox.classList.toggle('error',!!isError);}
function renderActionButtons(container,actions){container.innerHTML='';actions.forEach(action=>{const btn=document.createElement('button');btn.type='button';btn.className=('btn quiz-action-btn '+(action.className||'')).trim();btn.textContent=action.label;btn.addEventListener('click',action.onClick);container.appendChild(btn);});}
function lockOptions(disabled){optionsBox.querySelectorAll('button').forEach(btn=>btn.disabled=disabled);}
function renderQuestion(shouldSpeak){const q=question();if(!q){onDifficultyFinished();return;}state.waitingAction='question';state.answeredLocked=false;currentDecisionSpeech='';hideFeedback();difficultyCard.style.display='none';decisionCard.style.display='none';questionCard.style.display='block';difficultyBadge.textContent=labelOf(state.currentDifficulty);questionProgress.textContent='第 '+(state.questionIndex+1)+' / '+questions().length+' 题';questionText.textContent=q.question||'';optionsBox.innerHTML='';(q.options||[]).forEach(option=>{const btn=document.createElement('button');btn.type='button';btn.className='quiz-option-btn';btn.innerHTML='<span class=\"quiz-option-key\">'+option.key+'</span><span>'+option.text+'</span>';btn.addEventListener('click',()=>submitAnswer(option.key));optionsBox.appendChild(btn);});if(shouldSpeak!==false)announce(questionSpeech(q));}
function startDifficulty(difficulty,startIndex,shouldSpeak){const list=((QUIZ_DATA&&QUIZ_DATA.difficulties)||{})[difficulty]||[];if(!list.length){announce('这个难度下暂时没有题目。');return;}state.currentDifficulty=difficulty;state.questionIndex=Math.min(Math.max(startIndex||0,0),list.length-1);renderQuestion(shouldSpeak);}
function goToQuestion(index){if(!questions().length)return;if(index<0){announce('已经是当前难度的第一题。');return;}if(index>=questions().length){announce('已经是当前难度的最后一题。');return;}stopSpeech();state.questionIndex=index;renderQuestion(true);}
function adjustRate(delta){const current=typeof window._rate==='number'?window._rate:1;const next=Math.min(2,Math.max(.5,Math.round((current+delta)*10)/10));if(next===current){announce(delta>0?'已经是最快语速。':'已经是最慢语速。');return;}if(typeof window.applyNewRate==='function'){window.applyNewRate(next);}else{window._rate=next;announce('当前语速 '+next.toFixed(1)+' 倍。');}}
function finishQuiz(){stopSpeech();if(RETURN_URL){window.location.href=RETURN_URL;return;}const base="{{ url_for('exercise_actions') }}";window.location.href=SOURCE_FILE?(base+'?source_file='+encodeURIComponent(SOURCE_FILE)):base;}
function showDifficulty(shouldSpeak){state.currentDifficulty=null;state.questionIndex=0;state.waitingAction='difficulty';state.answeredLocked=false;currentDecisionSpeech='';hideFeedback();questionCard.style.display='none';decisionCard.style.display='none';difficultyCard.style.display='block';if(shouldSpeak!==false)announce(difficultySpeech());}
function submitAnswer(key){if(state.waitingAction!=='question'||state.answeredLocked)return;const q=question();if(!q)return;state.answeredLocked=true;state.waitingAction='after_answer';lockOptions(true);const last=state.questionIndex===questions().length-1;const nextLabel=last?'完成本组':'下一题';if(key===q.answer){showFeedback('回答正确。按右方向键或按钮进入下一步。',false);renderActionButtons(feedbackActions,[{label:nextLabel,className:'btn-success',onClick:proceedAfterAnswer}]);feedbackActions.style.display='flex';announce(currentSpeech());return;}recordMistake(q,key);showFeedback('回答错误。\\n正确答案：'+answerLabel(q)+'\\n解析：'+(q.explanation||'暂无解析'),true);renderActionButtons(feedbackActions,[{label:nextLabel,className:'btn-secondary',onClick:proceedAfterAnswer}]);feedbackActions.style.display='flex';announce(currentSpeech());}
function proceedAfterAnswer(){stopSpeech();if(state.questionIndex<questions().length-1){state.questionIndex+=1;renderQuestion(true);return;}onDifficultyFinished();}
function renderDecision(title,text,actions,speechText,mode,shouldSpeak){questionCard.style.display='none';difficultyCard.style.display='none';decisionCard.style.display='block';state.waitingAction=mode;currentDecisionSpeech=speechText||[title,text].filter(Boolean).join('。');decisionTitle.textContent=title;decisionText.textContent=text;renderActionButtons(decisionActions,actions);if(shouldSpeak!==false)announce(currentDecisionSpeech);}
function onDifficultyFinished(){if(IS_MISTAKE_REDO){renderDecision('错题重做完成','这一份文档的错题已经做完了。',[{label:'再做一遍这份文档',className:'btn-success',onClick:()=>startDifficulty(AUTO_START_DIFFICULTY||state.currentDifficulty||'错题重做',0,true)},{label:'返回错题本',className:'btn-secondary',onClick:finishQuiz}],'这一份文档的错题已经做完。按 C 再做一遍，按 E 返回错题本。','complete',true);return;}const upcoming=nextDifficulty();if(upcoming){renderDecision(labelOf(state.currentDifficulty)+'已完成','是否继续下一档难度？',[{label:'继续下一档',className:'btn-success',onClick:()=>startDifficulty(upcoming,0,true)},{label:'结束返回',className:'btn-secondary',onClick:finishQuiz}],'当前难度已完成。按 C 继续下一档难度，按 E 结束返回。','continue',true);return;}finishQuiz();}
function normalizeText(text){return (text||'').toLowerCase().replace(/\s+/g,'').replace(/[，。！？、,.!?：:；;]/g,'');}
function matchOptionBySpeech(q,transcript){const normalized=normalizeText(transcript);const alias={A:['a','选a','答案a','第一项','第一个'],B:['b','选b','答案b','第二项','第二个'],C:['c','选c','答案c','第三项','第三个'],D:['d','选d','答案d','第四项','第四个']};for(const option of (q.options||[])){if((alias[option.key]||[]).some(item=>normalized.includes(normalizeText(item))))return option.key;const optionText=normalizeText(option.text);if(optionText&&optionText.length>=2&&normalized.includes(optionText))return option.key;}return null;}
function handleVoiceCommand(transcript){const normalized=normalizeText(transcript);if(!normalized)return;if(state.waitingAction==='difficulty'){if(normalized.includes('简单')&&difficultyByRank(0)){startDifficulty(difficultyByRank(0),0,true);return;}if((normalized.includes('中等')||normalized.includes('普通'))&&difficultyByRank(1)){startDifficulty(difficultyByRank(1),0,true);return;}if(normalized.includes('困难')&&difficultyByRank(2)){startDifficulty(difficultyByRank(2),0,true);return;}if(normalized.includes('结束')||normalized.includes('返回')){finishQuiz();return;}announce('没有听清要选择哪一个难度。');return;}if(state.waitingAction==='question'){const q=question();const matched=q?matchOptionBySpeech(q,transcript):null;if(matched){submitAnswer(matched);return;}announce('没有识别到明确的选项。');return;}if(state.waitingAction==='after_answer'){if(normalized.includes('下一')||normalized.includes('继续')){proceedAfterAnswer();return;}announce('请说下一题或继续。');return;}if(state.waitingAction==='continue'){if(normalized.includes('继续')){const up=nextDifficulty();if(up)startDifficulty(up,0,true);return;}if(normalized.includes('结束')||normalized.includes('返回')){finishQuiz();return;}announce('请说继续或结束。');return;}if(state.waitingAction==='complete'&&IS_MISTAKE_REDO){if(normalized.includes('再做')){startDifficulty(AUTO_START_DIFFICULTY||state.currentDifficulty||'错题重做',0,true);return;}if(normalized.includes('返回')||normalized.includes('结束')){finishQuiz();return;}announce('请说再做一遍或返回错题本。');}}
function ensureRecognition(){const Cls=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Cls){announce('当前浏览器不支持语音识别。');return false;}if(!recognition){recognition=new Cls();recognition.lang='zh-CN';recognition.continuous=false;recognition.interimResults=true;recognition.onresult=function(event){let transcript='';for(let i=event.resultIndex;i<event.results.length;i+=1){transcript+=event.results[i][0].transcript;}lastTranscript=transcript;};recognition.onerror=function(event){isRecording=false;voiceSource='';if(event.error!=='aborted')announce('语音识别失败，请再试一次。');};recognition.onend=function(){const transcript=lastTranscript.trim();isRecording=false;voiceSource='';lastTranscript='';if(transcript)handleVoiceCommand(transcript);};}return true;}
function startVoiceCapture(source){if(!ensureRecognition()||isRecording)return;stopSpeech();lastTranscript='';isRecording=true;voiceSource=source;try{recognition.start();}catch(error){isRecording=false;voiceSource='';announce('无法启动语音识别。');}}
function stopVoiceCapture(source){if(!isRecording||!recognition||voiceSource!==source)return;recognition.stop();}
function recordMistake(q,selectedKey){if(!q||IS_MISTAKE_REDO)return;const sourceFilename=SOURCE_FILE||window._uploadedFileName||'未命名文档';fetch("{{ url_for('api_add_mistake') }}",{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_filename:sourceFilename,difficulty:state.currentDifficulty||'',question_text:q.question||'',options:Array.isArray(q.options)?q.options:[],correct_answer:answerLabel(q),explanation:q.explanation||'',selected_answer:selectedKey||''})}).catch(error=>console.warn('记录错题失败',error));}
window._aiAssistantGetPageContext=function(){const q=question();return{page:'exercise_challenge',uploaded_filename:window._aiAssistantDocumentName||'',current_difficulty:state.currentDifficulty||'',current_step:state.waitingAction||'',current_question_index:q?state.questionIndex+1:0,current_question_total:questions().length,current_question:q?q.question:'',current_options:q?q.options.map(option=>option.key+'. '+option.text).join('\\n'):''};};
document.addEventListener('keydown',function(event){if(editable(event.target)||event.repeat||window._tutorialActive||window._helpOverlayOpen||window._aiWindowOpen)return;if(event.altKey||event.metaKey)return;if(event.ctrlKey)return;switch(event.code){case 'Digit1':case 'Numpad1':if(state.waitingAction==='difficulty'&&difficultyByRank(0)){event.preventDefault();startDifficulty(difficultyByRank(0),0,true);}return;case 'Digit2':case 'Numpad2':if(state.waitingAction==='difficulty'&&difficultyByRank(1)){event.preventDefault();startDifficulty(difficultyByRank(1),0,true);}return;case 'Digit3':case 'Numpad3':if(state.waitingAction==='difficulty'&&difficultyByRank(2)){event.preventDefault();startDifficulty(difficultyByRank(2),0,true);}return;case 'Digit4':case 'Numpad4':if(state.waitingAction==='difficulty'){event.preventDefault();finishQuiz();}return;case 'KeyA':case 'KeyB':case 'KeyC':case 'KeyD':if(state.waitingAction==='question'){event.preventDefault();submitAnswer(event.code.replace('Key',''));return;}if(state.waitingAction==='continue'&&event.code==='KeyC'){const up=nextDifficulty();if(up){event.preventDefault();startDifficulty(up,0,true);}return;}if(state.waitingAction==='complete'&&IS_MISTAKE_REDO&&event.code==='KeyC'){event.preventDefault();startDifficulty(AUTO_START_DIFFICULTY||state.currentDifficulty||'错题重做',0,true);return;}return;case 'KeyE':if(state.waitingAction==='continue'||(state.waitingAction==='complete'&&IS_MISTAKE_REDO)){event.preventDefault();finishQuiz();}return;case 'KeyV':event.preventDefault();event.stopPropagation();holdV=true;startVoiceCapture('keyboard');return;case 'KeyR':event.preventDefault();repeatSpeech();return;case 'ArrowLeft':event.preventDefault();if(state.waitingAction==='difficulty'){window.location.href=backToResultLink.href;}else{goToQuestion(state.questionIndex-1);}return;case 'ArrowRight':event.preventDefault();if(state.waitingAction==='after_answer'){proceedAfterAnswer();}else if(state.waitingAction==='question'){goToQuestion(state.questionIndex+1);}return;default:return;}},true);
document.addEventListener('keyup',function(event){if(editable(event.target)||event.code!=='KeyV')return;event.preventDefault();event.stopPropagation();holdV=false;stopVoiceCapture('keyboard');},true);
window.addEventListener('blur',function(){if(!holdV)return;holdV=false;stopVoiceCapture('keyboard');});
document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('[data-difficulty]').forEach(btn=>btn.addEventListener('click',()=>startDifficulty(btn.getAttribute('data-difficulty'),0,true)));const skip=document.querySelector('[data-skip]');if(skip)skip.addEventListener('click',finishQuiz);document.getElementById('quiz-back-link').addEventListener('click',stopSpeech);if(AUTO_START_DIFFICULTY){startDifficulty(AUTO_START_DIFFICULTY,AUTO_START_QUESTION_INDEX||0,false);}else{showDifficulty(false);}setTimeout(announcePageOnce,420);});
</script>
{% endblock %}
