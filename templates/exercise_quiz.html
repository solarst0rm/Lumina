{% extends "layout.html" %}

{% block page_title %}练习闯关{% endblock %}

{% block content %}
<style>
    .quiz-topbar {
        display: flex;
        justify-content: flex-start;
        margin-bottom: 18px;
    }

    .quiz-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
    }

    .quiz-choice-btn,
    .quiz-option-btn,
    .quiz-action-btn {
        width: 100%;
        min-height: 58px;
        font-size: 1rem;
    }

    .quiz-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
    }

    .quiz-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        color: var(--text-secondary);
    }

    .quiz-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 107, 53, 0.12);
        color: var(--primary-color);
        padding: 6px 12px;
        border-radius: 999px;
        font-weight: 600;
    }

    .quiz-question {
        font-size: 1.1rem;
        line-height: 1.8;
        margin-bottom: 18px;
    }

    .quiz-options {
        display: grid;
        gap: 12px;
    }

    .quiz-option-btn {
        border: 1px solid var(--border-color);
        background: var(--surface-color);
        color: var(--text-primary);
        border-radius: 12px;
        padding: 16px 18px;
        cursor: pointer;
        text-align: left;
        transition: all 0.2s ease;
    }

    .quiz-option-btn:hover,
    .quiz-option-btn:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.08);
    }

    .quiz-option-btn[disabled] {
        opacity: 0.78;
        cursor: not-allowed;
    }

    .quiz-option-key {
        display: block;
        font-weight: 700;
        color: var(--primary-color);
        margin-bottom: 4px;
    }

    .quiz-feedback {
        margin-top: 18px;
        padding: 16px 18px;
        border-radius: 12px;
        background: rgba(56, 161, 105, 0.08);
        border: 1px solid rgba(56, 161, 105, 0.16);
        display: none;
        white-space: pre-wrap;
        line-height: 1.8;
    }

    .quiz-feedback.error {
        background: rgba(229, 62, 62, 0.08);
        border-color: rgba(229, 62, 62, 0.18);
    }

    .quiz-feedback-actions {
        margin-top: 16px;
        display: none;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: flex-end;
    }

    .quiz-loading-mask {
        position: fixed;
        inset: 0;
        background: rgba(45, 55, 72, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10020;
    }

    .quiz-loading-box {
        background: white;
        border-radius: 16px;
        padding: 28px 32px;
        min-width: 280px;
        text-align: center;
        box-shadow: 0 22px 60px rgba(0, 0, 0, 0.18);
    }
</style>

<div class="quiz-topbar">
    <a href="{{ url_for('exercise_actions') }}" class="btn btn-secondary">
        <i class="fas fa-arrow-left"></i> 返回练习操作
    </a>
</div>

<div id="difficulty-card" class="card">
    <h2 style="margin-bottom: 16px;">请选择闯关难度</h2>
    <div class="quiz-grid">
        {% for difficulty, questions in quiz_data.difficulties.items() %}
        <button class="btn quiz-choice-btn" data-difficulty="{{ difficulty }}">
            {{ {'Easy': '简单', 'Medium': '中等', 'Hard': '困难'}.get(difficulty, difficulty) }} · {{ questions | length }} 题
        </button>
        {% endfor %}
        <button class="btn btn-secondary quiz-choice-btn" data-skip="1">暂不开始</button>
    </div>
</div>

<div id="question-card" class="card" style="display:none;">
    <div class="quiz-header">
        <div class="quiz-meta">
            <span id="difficulty-badge" class="quiz-badge"></span>
            <span id="question-progress"></span>
        </div>
    </div>
    <div id="question-text" class="quiz-question"></div>
    <div id="options-box" class="quiz-options"></div>
    <div id="feedback-box" class="quiz-feedback"></div>
    <div id="feedback-actions" class="quiz-feedback-actions"></div>
</div>

<div id="decision-card" class="card" style="display:none;">
    <h3 id="decision-title" style="color: var(--primary-color); margin-bottom: 10px;"></h3>
    <p id="decision-text" style="color: var(--text-secondary); margin-bottom: 18px;"></p>
    <div id="decision-actions" class="quiz-grid"></div>
</div>

<div id="quiz-loading-mask" class="quiz-loading-mask">
    <div class="quiz-loading-box">
        <div class="spinner" style="margin-bottom: 16px;"></div>
        <p id="quiz-loading-text" style="margin: 0; color: var(--text-secondary);">正在处理中...</p>
    </div>
</div>

<script>
window._sumText = '';
window._exText = {{ exercise_markdown | tojson }};

let quizData = {{ quiz_data | tojson }};
const difficultyLabelMap = {
    Easy: '简单',
    Medium: '中等',
    Hard: '困难',
    简单: '简单',
    中等: '中等',
    困难: '困难'
};
const state = {
    currentDifficulty: null,
    questionIndex: 0,
    answeredLocked: false
};

const difficultyCard = document.getElementById('difficulty-card');
const questionCard = document.getElementById('question-card');
const decisionCard = document.getElementById('decision-card');
const decisionTitle = document.getElementById('decision-title');
const decisionText = document.getElementById('decision-text');
const decisionActions = document.getElementById('decision-actions');
const difficultyBadge = document.getElementById('difficulty-badge');
const questionProgress = document.getElementById('question-progress');
const questionText = document.getElementById('question-text');
const optionsBox = document.getElementById('options-box');
const feedbackBox = document.getElementById('feedback-box');
const feedbackActions = document.getElementById('feedback-actions');
const loadingMask = document.getElementById('quiz-loading-mask');
const loadingText = document.getElementById('quiz-loading-text');

function getDifficultyOrder() {
    const difficulties = (quizData && quizData.difficulties) || {};
    const canonical = ['Easy', 'Medium', 'Hard'].filter(function(key) {
        return Object.prototype.hasOwnProperty.call(difficulties, key);
    });
    const extras = Object.keys(difficulties).filter(function(key) {
        return canonical.indexOf(key) === -1;
    });
    return canonical.concat(extras);
}

function getDifficultyLabel(difficulty) {
    return difficultyLabelMap[difficulty] || difficulty;
}

function speak(text) {
    if (!window.speechSynthesis || !text) {
        return;
    }
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'zh-CN';
    utterance.rate = window._rate || 1;
    window.speechSynthesis.speak(utterance);
}

function showLoading(text) {
    loadingText.textContent = text;
    loadingMask.style.display = 'flex';
}

function hideLoading() {
    loadingMask.style.display = 'none';
}

function getCurrentQuestions() {
    return (quizData.difficulties || {})[state.currentDifficulty] || [];
}

function getCurrentQuestion() {
    return getCurrentQuestions()[state.questionIndex];
}

function nextDifficulty() {
    const order = getDifficultyOrder();
    const currentIndex = order.indexOf(state.currentDifficulty);
    if (currentIndex === -1 || currentIndex === order.length - 1) {
        return null;
    }
    return order[currentIndex + 1];
}

function showDifficultySelection() {
    state.currentDifficulty = null;
    state.questionIndex = 0;
    state.answeredLocked = false;
    difficultyCard.style.display = 'block';
    questionCard.style.display = 'none';
    decisionCard.style.display = 'none';
    feedbackBox.style.display = 'none';
    feedbackActions.style.display = 'none';
    speak('请选择想开始的难度。');
}

function startDifficulty(difficulty) {
    state.currentDifficulty = difficulty;
    state.questionIndex = 0;
    renderQuestion();
}

function lockOptions(locked) {
    optionsBox.querySelectorAll('button').forEach(function(button) {
        button.disabled = locked;
    });
}

function renderQuestion() {
    const question = getCurrentQuestion();
    if (!question) {
        onDifficultyFinished();
        return;
    }

    state.answeredLocked = false;
    difficultyCard.style.display = 'none';
    decisionCard.style.display = 'none';
    questionCard.style.display = 'block';
    feedbackBox.style.display = 'none';
    feedbackActions.style.display = 'none';
    feedbackActions.innerHTML = '';

    difficultyBadge.textContent = getDifficultyLabel(state.currentDifficulty);
    questionProgress.textContent = `第 ${state.questionIndex + 1} / ${getCurrentQuestions().length} 题`;
    questionText.textContent = question.question;
    optionsBox.innerHTML = '';

    question.options.forEach(function(option) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'quiz-option-btn';
        button.innerHTML = `
            <span class="quiz-option-key">${option.key}</span>
            <span>${option.text}</span>
        `;
        button.addEventListener('click', function() {
            submitAnswer(option.key);
        });
        optionsBox.appendChild(button);
    });

    speak(`${getDifficultyLabel(state.currentDifficulty)}模式，第${state.questionIndex + 1}题。${question.question}`);
}

function showFeedback(text, isError) {
    feedbackBox.style.display = 'block';
    feedbackBox.textContent = text;
    feedbackBox.classList.toggle('error', !!isError);
}

function renderActionButtons(actions) {
    feedbackActions.innerHTML = '';
    actions.forEach(function(action) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `btn quiz-action-btn ${action.className || ''}`.trim();
        button.textContent = action.label;
        button.addEventListener('click', action.onClick);
        feedbackActions.appendChild(button);
    });
    feedbackActions.style.display = 'flex';
}

function proceedAfterAnswer() {
    const questionCount = getCurrentQuestions().length;
    if (state.questionIndex < questionCount - 1) {
        state.questionIndex += 1;
        renderQuestion();
        return;
    }
    onDifficultyFinished();
}

function submitAnswer(selectedKey) {
    if (state.answeredLocked) {
        return;
    }

    const question = getCurrentQuestion();
    if (!question) {
        return;
    }

    state.answeredLocked = true;
    lockOptions(true);

    const answerOption = question.options.find(function(option) {
        return option.key === question.answer;
    });
    const nextLabel = state.questionIndex === getCurrentQuestions().length - 1 ? '完成本轮' : '下一题';

    if (selectedKey === question.answer) {
        showFeedback(`回答正确。\n解析：${question.explanation}`, false);
        renderActionButtons([
            { label: nextLabel, className: 'btn-success', onClick: proceedAfterAnswer }
        ]);
        speak('回答正确。');
        return;
    }

    const answerText = answerOption ? `${answerOption.key}. ${answerOption.text}` : question.answer;
    showFeedback(`回答不正确。\n正确答案：${answerText}\n解析：${question.explanation}`, true);
    renderActionButtons([
        { label: nextLabel, className: 'btn-secondary', onClick: proceedAfterAnswer }
    ]);
    speak(`回答不正确。正确答案是 ${answerText}。`);
}

function renderDecision(title, text, actions) {
    questionCard.style.display = 'none';
    difficultyCard.style.display = 'none';
    decisionCard.style.display = 'block';
    decisionTitle.textContent = title;
    decisionText.textContent = text;
    decisionActions.innerHTML = '';

    actions.forEach(function(action) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `btn quiz-action-btn ${action.className || ''}`.trim();
        button.textContent = action.label;
        button.addEventListener('click', action.onClick);
        decisionActions.appendChild(button);
    });

    speak(text);
}

function onDifficultyFinished() {
    const upcoming = nextDifficulty();
    if (upcoming) {
        renderDecision(
            `${getDifficultyLabel(state.currentDifficulty)}难度已完成`,
            '是否继续挑战下一档难度？',
            [
                { label: '继续挑战', className: 'btn-success', onClick: function() { startDifficulty(upcoming); } },
                { label: '先回练习页', className: 'btn-secondary', onClick: finishQuiz }
            ]
        );
        return;
    }

    renderDecision(
        '本次闯关完成',
        '你已经完成当前全部难度。可以重新生成一套练习题，或者返回练习操作页。',
        [
            { label: '重新生成练习题', className: 'btn-success', onClick: regenerateExercises },
            { label: '返回练习页', className: 'btn-secondary', onClick: finishQuiz }
        ]
    );
}

function finishQuiz() {
    window.location.href = "{{ url_for('exercise_actions') }}";
}

function regenerateExercises() {
    showLoading('正在重新生成练习题，请稍候...');
    fetch("{{ url_for('api_regenerate_exercise') }}", {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({})
    })
        .then(function(response) {
            return response.json();
        })
        .then(function(data) {
            hideLoading();
            if (!data.success) {
                renderDecision(
                    '重新生成失败',
                    data.error || '重新生成练习题失败，请稍后再试。',
                    [
                        { label: '再试一次', className: 'btn-success', onClick: regenerateExercises },
                        { label: '返回练习页', className: 'btn-secondary', onClick: finishQuiz }
                    ]
                );
                return;
            }

            quizData = data.quiz_data;
            window._exText = data.exercise_markdown || '';
            showDifficultySelection();
        })
        .catch(function(error) {
            hideLoading();
            renderDecision(
                '重新生成失败',
                error.message || '重新生成练习题失败，请稍后再试。',
                [
                    { label: '再试一次', className: 'btn-success', onClick: regenerateExercises },
                    { label: '返回练习页', className: 'btn-secondary', onClick: finishQuiz }
                ]
            );
        });
}

document.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('[data-difficulty]').forEach(function(button) {
        button.addEventListener('click', function() {
            startDifficulty(button.getAttribute('data-difficulty'));
        });
    });

    const skipButton = document.querySelector('[data-skip]');
    if (skipButton) {
        skipButton.addEventListener('click', finishQuiz);
    }

    showDifficultySelection();
});
</script>
{% endblock %}
