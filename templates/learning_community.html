{% extends "layout.html" %}

{% block page_title %}学习社区{% endblock %}

{% block content %}
<style>
    .community-toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-bottom: 16px;
    }

    .community-search {
        flex: 1;
        min-width: 240px;
        display: flex;
        gap: 12px;
        align-items: center;
    }

    .community-search input {
        flex: 1;
    }

    .community-meta {
        color: var(--text-secondary);
        font-size: 13px;
    }

    .community-post {
        margin-bottom: 16px;
    }

    .community-post-title {
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
        margin-bottom: 10px;
    }

    .community-post-title h3 {
        margin: 0;
        color: var(--primary-color);
        font-size: 1.1rem;
        font-weight: 800;
    }

    .community-post-snippet {
        color: var(--text-secondary);
        white-space: pre-wrap;
        line-height: 1.8;
    }

    .community-post-snippet.is-rendered {
        color: var(--text-primary);
        white-space: normal;
    }

    .community-post-snippet.is-rendered h1,
    .community-post-snippet.is-rendered h2,
    .community-post-snippet.is-rendered h3,
    .community-post-snippet.is-rendered h4,
    .community-post-snippet.is-rendered h5,
    .community-post-snippet.is-rendered h6 {
        color: var(--primary-color);
        margin: 14px 0 8px;
        line-height: 1.35;
    }

    .community-post-snippet.is-rendered p,
    .community-post-snippet.is-rendered li,
    .community-post-snippet.is-rendered blockquote {
        line-height: 1.8;
    }

    .community-post-snippet.is-rendered p + p {
        margin-top: 10px;
    }

    .community-post-snippet.is-rendered ul,
    .community-post-snippet.is-rendered ol {
        padding-left: 22px;
        margin: 10px 0;
    }

    .community-post-snippet.is-rendered blockquote {
        margin: 12px 0;
        padding: 10px 14px;
        border-left: 4px solid var(--secondary-color);
        background: rgba(247, 147, 30, 0.08);
        border-radius: 8px;
    }

    .community-post-snippet.is-rendered code {
        padding: 2px 6px;
        border-radius: 6px;
        background: rgba(45, 55, 72, 0.08);
        font-family: "Consolas", "Courier New", monospace;
    }

    .community-post-snippet.is-rendered hr {
        border: none;
        border-top: 1px solid var(--border-color);
        margin: 14px 0;
    }

    .community-post-snippet.is-rendered a {
        color: var(--primary-color);
        font-weight: 600;
    }

    .community-post-actions {
        margin-top: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
    }

    .community-empty {
        text-align: center;
        color: var(--text-secondary);
        padding: 28px 0;
    }
</style>

<div class="card" id="community-page-root">
    <div class="community-toolbar">
        <div class="community-search" role="search" aria-label="学习社区搜索">
            <input
                id="community-search-input"
                type="text"
                placeholder="搜索标题、内容或发布者"
                autocomplete="off"
            />
            <button type="button" class="btn btn-secondary" id="community-file-toggle" style="display:none;">
                <i class="fas fa-file"></i> 同步到本地文件
            </button>
        </div>
        <div class="community-meta" id="community-storage-hint" aria-live="polite"></div>
    </div>

    <div class="community-meta">
        在这里可以查看自己和其他同学上传的总结、学习包与经验分享。
    </div>
</div>

<div id="community-post-list" aria-live="polite"></div>
{% endblock %}
